services:
  db:
    image: postgres:16-alpine
    container_name: review_web_db
    environment:
      POSTGRES_DB: review_web_tirunelveli
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: review_web_backend
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: "docker-compose-dev-secret-key-review-web"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/review_web_tirunelveli"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      GOOGLE_OAUTH_TEST_MODE: "True"
      JWT_SECRET: "docker-compose-jwt-secret-review-web"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py populate_reference_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  frontend:
    image: node:20-alpine
    container_name: review_web_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://localhost:8000/api/v1"
    command: >
      sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
